<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Shreya Model Studio</title>
  <style>
    body { margin: 0; background: #0f0910; overflow: hidden; font-family: monospace; }
    #c { width: 100vw; height: 100vh; display: block; }
    #hud { position: absolute; top: 18px; left: 20px; color: #ff6faa; z-index: 10; font-size: 14px; font-weight: bold; background: rgba(18,10,20,0.85); padding: 10px 16px; border: 1px solid #ff6faa; box-shadow: 0 0 15px rgba(255,111,170,0.25); border-radius: 4px; }
    #speechBubble { position: absolute; top: 22px; right: 25px; max-width: 380px; background: rgba(26,14,28,0.92); border: 2px solid #ff6faa; color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 13px; line-height: 1.5; z-index: 10; box-shadow: 0 0 20px rgba(255,111,170,0.3); transition: all 0.25s ease; }
    .hud-controls { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 20; flex-wrap: wrap; justify-content: center; max-width: 90vw; }
    .task-btn { padding: 11px 18px; background: #201024; color: #ff6faa; border: 1px solid #ff6faa; font-family: monospace; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 6px; box-shadow: 0 0 12px rgba(255,111,170,0.25); transition: all 0.2s ease; }
    .task-btn:hover, .task-btn.active { background: #ff6faa; color: #1a0a1c; box-shadow: 0 0 22px rgba(255,111,170,0.65); transform: translateY(-2px); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="assets/GLTFLoader.js"></script>
  <script src="assets/OrbitControls.js"></script>
</head>
<body>
<div id="hud">● LOADING 3D SHREYA FIGURINE...</div>
<div id="speechBubble">"Level 19 unlocked! Welcome to my 3D Figurine Showcase ✨"</div>
<canvas id="c"></canvas>

<div class="hud-controls" id="btnContainer"></div>

<script>
  const canvas = document.getElementById('c');
  const hud = document.getElementById('hud');
  const speechBubble = document.getElementById('speechBubble');
  const btnContainer = document.getElementById('btnContainer');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f0910);
  scene.fog = new THREE.FogExp2(0x0f0910, 0.04);

  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.40, 2.0);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 1.2;
  controls.target.set(0, 1.20, 0);
  controls.minDistance = 1.0;
  controls.maxDistance = 5.0;
  controls.update();

  // Studio Lighting
  const hemiLight = new THREE.HemisphereLight(0xffe8f2, 0x1f1020, 1.3);
  scene.add(hemiLight);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
  keyLight.position.set(2.5, 4.5, 3.5);
  scene.add(keyLight);

  const fillLight = new THREE.PointLight(0xff6faa, 2.8, 20);
  fillLight.position.set(-2.5, 2.5, 2.5);
  scene.add(fillLight);

  const rimLight = new THREE.PointLight(0x67e8f9, 3.2, 20);
  rimLight.position.set(0, 2.8, -2.8);
  scene.add(rimLight);

  // Turntable Pedestal
  const stageGroup = new THREE.Group();
  scene.add(stageGroup);

  const baseGeo = new THREE.CylinderGeometry(1.65, 1.75, 0.12, 48);
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x190e18, metalness: 0.85, roughness: 0.25 });
  const baseMesh = new THREE.Mesh(baseGeo, baseMat);
  baseMesh.position.y = -0.06;
  stageGroup.add(baseMesh);

  const rimGeo = new THREE.TorusGeometry(1.68, 0.028, 16, 64);
  const rimMat = new THREE.MeshBasicMaterial({ color: 0xff6faa });
  const rimMesh = new THREE.Mesh(rimGeo, rimMat);
  rimMesh.rotation.x = Math.PI / 2;
  stageGroup.add(rimMesh);

  const outerRingGeo = new THREE.TorusGeometry(1.9, 0.015, 16, 64);
  const outerRingMat = new THREE.MeshBasicMaterial({ color: 0x67e8f9, wireframe: true });
  const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
  outerRing.rotation.x = Math.PI / 2;
  stageGroup.add(outerRing);

  // Floating Sparkles
  const sparkGeo = new THREE.BufferGeometry();
  const sparkCount = 70;
  const sparkPos = new Float32Array(sparkCount * 3);
  for (let i = 0; i < sparkCount * 3; i += 3) {
    sparkPos[i] = (Math.random() - 0.5) * 4.5;
    sparkPos[i + 1] = 0.2 + Math.random() * 2.8;
    sparkPos[i + 2] = (Math.random() - 0.5) * 4.5;
  }
  sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkPos, 3));
  const sparkMat = new THREE.PointsMaterial({ size: 0.06, color: 0xffb8db, transparent: true, opacity: 0.85 });
  const sparkles = new THREE.Points(sparkGeo, sparkMat);
  scene.add(sparkles);

  const loader = new THREE.GLTFLoader();
  const clock = new THREE.Clock();
  let mixer = null;
  const actions = {};
  let currentAction = null;
  let modelObj = null;
  let restHipsPos = null;

  let headMesh = null;
  let teethMesh = null;
  let isTalking = false;

  function loadAnim(url, name) {
    return new Promise((resolve) => {
      loader.load(url, (gltf) => {
        if (gltf.animations && gltf.animations.length > 0) {
          const clip = gltf.animations[0];
          clip.name = name;
          resolve(clip);
        } else {
          resolve(null);
        }
      }, undefined, (err) => {
        console.warn('Could not load anim ' + url, err);
        resolve(null);
      });
    });
  }

  function fadeToAction(name, duration = 0.35) {
    const nextAction = actions[name];
    if (!nextAction || nextAction === currentAction) return;
    if (currentAction) currentAction.fadeOut(duration);
    nextAction.reset().fadeIn(duration).play();
    currentAction = nextAction;
    hud.textContent = "3D SHREYA // ACTIVE: " + name.toUpperCase();
  }

  loader.load('assets/models/avaturn.glb', async (gltf) => {
    modelObj = gltf.scene;
    hud.textContent = "SHREYA 3D FIGURINE READY";

    // Traverse and customize materials for Shreya
    modelObj.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        const name = (child.name || '').toLowerCase();

        // 1. Head Mesh: natural smooth warm skin tone
        if (name.includes('head')) {
          headMesh = child;
          if (child.material) {
            child.material.color = new THREE.Color(0xf2bc9f);
            child.material.roughness = 0.52;
            child.material.metalness = 0.04;
            child.material.needsUpdate = true;
          }
        }
        // 2. Teeth Mesh for lip sync
        else if (name.includes('teeth')) {
          teethMesh = child;
        }
        // 3. Hair Meshes: Style to dark raven brunette matching Shreya's photo
        else if (name.includes('hair')) {
          if (child.material) {
            child.material.color = new THREE.Color(0x181318);
            child.material.roughness = 0.38;
            child.material.metalness = 0.12;
            child.material.needsUpdate = true;
          }
        }
        // 4. Eyes: Rich warm dark brown eyes
        else if (name.includes('eye') && !name.includes('lash') && !name.includes('ao')) {
          if (child.material) {
            child.material.color = new THREE.Color(0x2a160d);
            child.material.roughness = 0.12;
            child.material.needsUpdate = true;
          }
        }
        // 5. Outfit: Sleek dark blazer / jacket matching Shreya's black zip jacket
        else if (name.includes('look') || name.includes('body')) {
          if (child.material) {
            child.material.color = new THREE.Color(0x161316);
            child.material.roughness = 0.62;
            child.material.needsUpdate = true;
          }
        }
      }
    });

    // Attach Silver Oxidised Jhumkas to the Head bone
    const headBone = modelObj.getObjectByName('Head');
    if (headBone) {
      const silverMat = new THREE.MeshStandardMaterial({
        color: 0xcccccc,
        metalness: 0.88,
        roughness: 0.28
      });
      function makeJhumka(isLeft) {
        const g = new THREE.Group();
        const stud = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.006, 16), silverMat);
        stud.rotation.x = Math.PI / 2;
        g.add(stud);
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.002, 0.02, 8), silverMat);
        stem.position.y = -0.012;
        g.add(stem);
        const bell = new THREE.Mesh(new THREE.ConeGeometry(0.017, 0.022, 16, 1, true), silverMat);
        bell.position.y = -0.028;
        bell.rotation.x = Math.PI;
        g.add(bell);
        const bead = new THREE.Mesh(new THREE.SphereGeometry(0.005, 10, 10), silverMat);
        bead.position.y = -0.038;
        g.add(bead);
        g.position.set(isLeft ? 0.082 : -0.082, 0.02, 0.015);
        return g;
      }
      headBone.add(makeJhumka(true));
      headBone.add(makeJhumka(false));
    }

    // Center on pedestal
    const bbox = new THREE.Box3().setFromObject(modelObj);
    const center = bbox.getCenter(new THREE.Vector3());
    modelObj.position.x = -center.x;
    modelObj.position.y = -bbox.min.y;
    modelObj.position.z = -center.z;
    stageGroup.add(modelObj);

    const hipsBone = modelObj.getObjectByName('Hips');
    restHipsPos = hipsBone ? hipsBone.position.clone() : new THREE.Vector3(0, 1.01, 0.02);

    const validNodes = new Set();
    modelObj.traverse((child) => {
      if (child.name) validNodes.add(child.name);
    });

    mixer = new THREE.AnimationMixer(modelObj);
    function sanitizeAndStripRootMotion(clip) {
      if (!clip || !clip.tracks) return clip;
      clip.tracks = clip.tracks.filter((track) => {
        const delim = track.name.lastIndexOf('.');
        const nodeName = delim !== -1 ? track.name.slice(0, delim) : '';
        const prop = delim !== -1 ? track.name.slice(delim + 1) : '';

        // NEVER allow animation tracks to target root containers
        if (!nodeName || nodeName === modelObj.name || nodeName === 'Scene' || nodeName === 'Armature' || nodeName === 'RootNode') {
          return false;
        }
        // ONLY keep tracks for nodes that actually exist in modelObj
        // (Prevents Three.js PropertyBinding fallback to modelObj which corrupts model rotation/position!)
        if (!validNodes.has(nodeName)) {
          return false;
        }
        // Drop position tracks on any bone other than Hips
        if (prop === 'position' && nodeName !== 'Hips') {
          return false;
        }
        return true;
      });

      // For Hips.position, lock horizontal X and forward/backward Z drift
      clip.tracks.forEach((track) => {
        if (track.name === 'Hips.position') {
          const values = track.values;
          if (values && values.length >= 3) {
            for (let i = 0; i < values.length; i += 3) {
              values[i] = restHipsPos.x;     // Lock horizontal X
              values[i + 2] = restHipsPos.z; // Lock forward/backward Z!
            }
          }
        }
      });
      return clip;
    }

    // Load clean animations from clean_anims.glb + anim_talking.glb + anim_gestures.glb
    const [cleanAnimGltf, talkingClip, gestureClip] = await Promise.all([
      new Promise((res) => loader.load('assets/models/clean_anims.glb', res)),
      loadAnim('assets/models/anim_talking.glb', 'talking'),
      loadAnim('assets/models/anim_gestures.glb', 'gestures')
    ]);

    if (cleanAnimGltf && cleanAnimGltf.animations) {
      cleanAnimGltf.animations.forEach((clip) => {
        sanitizeAndStripRootMotion(clip);
        actions[clip.name.toLowerCase()] = mixer.clipAction(clip);
      });
    }
    if (talkingClip) {
      sanitizeAndStripRootMotion(talkingClip);
      actions['talking'] = mixer.clipAction(talkingClip);
    }
    if (gestureClip) {
      sanitizeAndStripRootMotion(gestureClip);
      actions['gestures'] = mixer.clipAction(gestureClip);
    }

    // Default to natural upright straight IDLE stance
    if (actions['idle']) {
      actions['idle'].play();
      currentAction = actions['idle'];
      hud.textContent = "3D SHREYA // ACTIVE: IDLE (STANDING STRAIGHT)";
    }

    camera.position.set(0, 1.40, 1.85);
    controls.target.set(0, 1.25, 0);
    controls.update();

    // Task Buttons
    const tasks = [
      { id: 'talk', label: '🗣️ TALK / VOICE', anim: 'talking', talk: true, speech: '"Hey! Happy 19th Birthday to me! Level 19 unlocked and ready for new adventures ✨"' },
      { id: 'gestures', label: '👋 HAND GESTURES', anim: 'gestures', talk: false, speech: '"K-Drama marathon or cozy gaming tonight? You already know I\'m bingeing all 16 episodes! 🍿🎮"' },
      { id: 'walk', label: '🚶‍♀️ CATWALK', anim: 'walk', talk: false, speech: '"Strutting into Level 19 with 100% celestial aura and pure birthday energy ✨💃"' },
      { id: 'dance', label: '💃 CELEBRATE DANCE', anim: 'dance_silly', talk: false, speech: '"Party protocol activated! Candle lit, confetti everywhere, let\'s gooo! 🎉🎂"' },
      { id: 'idle', label: '✨ IDLE (STAND STRAIGHT)', anim: 'idle', talk: false, speech: '"3D Shreya figurine authentic 1-of-1 diorama. 360° rotation enabled! ◈"' }
    ];

    tasks.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'task-btn' + (t.id === 'idle' ? ' active' : '');
      btn.textContent = t.label;
      btn.onclick = () => {
        document.querySelectorAll('.task-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        isTalking = !!t.talk;
        speechBubble.textContent = t.speech;
        speechBubble.style.transform = "scale(1.04)";
        setTimeout(() => speechBubble.style.transform = "scale(1.0)", 150);
        fadeToAction(t.anim);
      };
      btnContainer.appendChild(btn);
    });
  }, undefined, (err) => {
    hud.textContent = "ERR: " + err;
    console.error(err);
  });

  // Helper to set morph target weights on Head_Mesh and Teeth_Mesh
  function setMorphWeight(targetName, value) {
    if (headMesh && headMesh.morphTargetDictionary && headMesh.morphTargetInfluences) {
      const idx = headMesh.morphTargetDictionary[targetName];
      if (idx !== undefined) headMesh.morphTargetInfluences[idx] = value;
    }
    if (teethMesh && teethMesh.morphTargetDictionary && teethMesh.morphTargetInfluences) {
      const idx = teethMesh.morphTargetDictionary[targetName];
      if (idx !== undefined) teethMesh.morphTargetInfluences[idx] = value;
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const time = clock.getElapsedTime();

    if (mixer) mixer.update(delta);
    // Pin modelObj root rotation & Hips position so character NEVER drifts or tilts on Z/X axis
    if (modelObj) {
      modelObj.rotation.set(0, 0, 0);
      modelObj.quaternion.set(0, 0, 0, 1);
      const hips = modelObj.getObjectByName('Hips');
      if (hips && restHipsPos) {
        hips.position.x = restHipsPos.x;
        hips.position.z = restHipsPos.z;
      }
    }
    controls.update();
    outerRing.rotation.z += 0.008;
    sparkles.rotation.y += 0.002;

    // Real-time dynamic lip-sync when talking
    if (isTalking) {
      const speechWave = Math.max(0, Math.sin(time * 11) * 0.45 + Math.sin(time * 19) * 0.3 + Math.sin(time * 6) * 0.25);
      const vowelA = Math.max(0, Math.sin(time * 8.5) * 0.5);
      const vowelO = Math.max(0, Math.cos(time * 6.5) * 0.4);

      setMorphWeight('jawOpen', speechWave * 0.5);
      setMorphWeight('mouthOpen', speechWave * 0.4);
      setMorphWeight('viseme_aa', vowelA * 0.45);
      setMorphWeight('viseme_O', vowelO * 0.35);
      setMorphWeight('mouthSmile', 0.3 + Math.sin(time * 3) * 0.15);
    } else {
      // Gentle natural resting smile
      setMorphWeight('jawOpen', 0);
      setMorphWeight('mouthOpen', 0);
      setMorphWeight('viseme_aa', 0);
      setMorphWeight('viseme_O', 0);
      setMorphWeight('mouthSmile', 0.25);
    }

    // Natural eye blinking
    const blinkCycle = time % 3.6;
    let blink = 0;
    if (blinkCycle < 0.16) {
      blink = Math.sin((blinkCycle / 0.16) * Math.PI);
    }
    setMorphWeight('eyeBlinkLeft', blink);
    setMorphWeight('eyeBlinkRight', blink);

    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
